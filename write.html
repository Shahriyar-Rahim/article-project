<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Write an Article</title>
    <link rel="stylesheet" href="style.css">
    <!-- Quill.js Editor Styles -->
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
</head>
<body>
    <nav>
        <a href="index.html" class="logo">Campus Hub</a>
    </nav>

    <main class="editor-layout">
        <input type="text" id="post-title" placeholder="Article Title..." class="title-input">
        
        <div class="metadata-bar">
            <select id="post-role">
                <option value="Student">Student</option>
                <option value="Teacher">Teacher</option>
                <option value="Alumni">Alumni</option>
            </select>
            
            <select id="post-category">
                <option value="Academic">Academic</option>
                <option value="Experience">Experience</option>
                <option value="Projects">Projects</option>
                <option value="Jobs">Jobs</option>
            </select>
            
            <input type="text" id="author-name" placeholder="Your Name">
        </div>

        <!-- The Quill Editor Container -->
        <div id="editor-container"></div>
        
        <button id="publish-btn" class="primary-btn">Publish</button>
    </main>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <!-- Quill.js Script -->
    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
    <!-- Custom Logic -->
    <script src="app.js"></script>
</body>
</html>
